# Builds the page and publishes it to GitHub Pages. This is the live deploy path.
#
# ONE-TIME MANUAL STEP, unavoidable: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". Until that is set, the configure-pages step below fails and
# the deploy is skipped.
#
# `enablement: true` was tried and does not work here. Turning Pages on is a repo
# ADMINISTRATION write, and the workflow's GITHUB_TOKEN only carries `pages: write`,
# which covers deployments and not the setting itself. Pushing a `gh-pages` branch does
# not auto-enable Pages either; GitHub retired that behaviour. Both were verified against
# this repository on 2026-09-09, so do not re-attempt either without new evidence.
#
# build.mjs has no dependencies — no npm install, no lockfile — so this is just Node
# and the checkout. It content-hashes everything under assets/, css/ and js/ and
# rewrites the references, which is what makes the immutable cache headers safe.
name: Deploy page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes the one in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: node build.mjs
      # Pages would otherwise run the artifact through Jekyll, which skips paths
      # beginning with an underscore.
      - name: Disable Jekyll
        run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
