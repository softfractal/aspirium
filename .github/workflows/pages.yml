# Builds the page and publishes it to GitHub Pages. This is the live deploy path.
#
# No repo setting has to be changed by hand: the configure-pages step below runs with
# `enablement: true`, so the first run turns Pages on itself using the workflow's own
# GITHUB_TOKEN and the `pages: write` permission granted here.
#
# build.mjs has no dependencies — no npm install, no lockfile — so this is just Node
# and the checkout. It content-hashes everything under assets/, css/ and js/ and
# rewrites the references, which is what makes the immutable cache headers safe.
name: Deploy page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes the one in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: node build.mjs
      # Pages would otherwise run the artifact through Jekyll, which skips paths
      # beginning with an underscore.
      - name: Disable Jekyll
        run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on if it is off, instead of failing the deploy and leaving a red
          # cross on the commit. Needs the pages: write permission declared above.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
