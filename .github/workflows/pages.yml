# Builds the page and publishes it to GitHub Pages. Manual fallback only — Cloudflare Pages is
# the live deploy path.
#
# Repo setting required once, by hand: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Without it this workflow runs and the deploy step fails.
#
# build.mjs has no dependencies — no npm install, no lockfile — so this is just Node
# and the checkout. It content-hashes everything under assets/, css/ and js/ and
# rewrites the references, which is what makes the immutable cache headers safe.
name: Deploy page to GitHub Pages

# Manual only. Cloudflare Pages is the deploy path (see README), and it builds this repo on every
# push by itself. Leaving this on `push` would run a second, competing deploy whose final step fails
# whenever GitHub Pages is not enabled, putting a red cross on every commit. Kept, not deleted, so
# GitHub Pages stays available as a fallback: run it from the Actions tab, and enable
# Settings -> Pages -> Source -> GitHub Actions first.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes the one in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: node build.mjs
      # Pages would otherwise run the artifact through Jekyll, which skips paths
      # beginning with an underscore.
      - name: Disable Jekyll
        run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
